services:
  tradingagents-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tradingagents-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - /home/leaphaz/apps/TradingAgents:/home/leaphaz/apps/TradingAgents
    networks:
      - invest-net
    mem_limit: 512m

networks:
  invest-net:
    external: true
    name: invest-portfolio_invest-net
